<html>
<head>
    <title>FlimShelf Login</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #eef7ff;
            margin: 0;
        }

        nav{
            background-color: #87CEEB;
            padding: 15px;
        }

        nav a{
            text-decoration: none;
            color: black;
            margin-right: 20px;
            font-weight: bold;
        }

        h1{
            text-align: center;
            color: #1f4e79;
            margin-top: 30px;
        }

        .login-box{
            width: 320px;
            background-color: white;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px lightgray;
        }

        .login-box h2{
            text-align: center;
            color: #1f4e79;
        }

        .login-box input{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .login-box button{
            width: 100%;
            padding: 10px;
            background-color: #87CEEB;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-box button:hover{
            background-color: #6bb7dc;
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html">Login</a>
</nav>

<h1>FlimShelf</h1>

<div class="login-box">
    <h2>User Login</h2>

    <form action="home.html">
        <label>Username</label>
        <input type="text" required>

        <label>Password</label>
        <input type="password" required>

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
