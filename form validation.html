<html>
    <head>
        <title>Document</title>
            <script>
                function check()
                {
                    var name=document.getElementById("name").value;
                    var email=document.getElementsById("email").value;
                    var password=document.getElementsById("pwd").value;
                    if(name==""||name==null)
                    {
                        alert("Full name should not be blank");
                    }
                    if(email==""||email==null)
                    {
                        alert("email should not be blank");
                    }
                    if(password==""||password==null)
                    {
                        alert("password entry is a must");
                    }
                }
            </script>
    </head>
    <body>
        <h1>Data entry form validation for name,email,password</h1>
        <form onsummit="check()">
            NAME: <input type="text" id="name"><br><br>
            EMAIL: <input type="email" id="email"><br><br>
            PASSWORD: <input type="password" id="pwd"><br><br>
            <input type="summit" value="check">
        </form>
    </body>
</html>
