<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:Arial,sans-serif;

background:linear-gradient(to right,#eef7ff,#d8edff);

}




nav{

background:skyblue;

padding:15px 30px;

box-shadow:0 3px 10px gray;

display:flex;

align-items:center;

flex-wrap:wrap;

}


.nav-left a{

text-decoration:none;

color:black;

font-weight:bold;

margin-right:25px;

}


.nav-left a:hover{

color:white;

}


.nav-right{

margin-left:auto;

}


.nav-right a{

text-decoration:none;

color:black;

font-weight:bold;

}


.nav-right a:hover{

color:white;

}



h1{

text-align:center;

color:#1f4e79;

margin:25px;

font-size:40px;

}




.section{

width:90%;

margin:30px auto;

background:white;

padding:30px;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.2);

}


.section h2{

text-align:center;

color:#1f4e79;

margin-bottom:25px;

}



.carousel-container{

height:520px;

display:flex;

justify-content:center;

align-items:center;

gap:20px;

overflow:hidden;

}


.carousel{

position:relative;

width:900px;

height:450px;

}


.movie-card{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

transition:.7s ease;

text-align:center;

opacity:0;

cursor:pointer;

}


.movie-card img{

width:260px;

height:370px;

object-fit:cover;

border-radius:15px;

box-shadow:0 10px 25px rgba(0,0,0,.35);

}


.movie-card h3{

margin-top:15px;

color:#1f4e79;

}



.center{

transform:

translate(-50%,-50%)

scale(1.25);

opacity:1;

z-index:5;

}


.left{

transform:

translate(-190%,-50%)

scale(.8)

rotateY(25deg);

opacity:.7;

z-index:3;

}


.right{

transform:

translate(90%,-50%)

scale(.8)

rotateY(-25deg);

opacity:.7;

z-index:3;

}


.hidden{

opacity:0;

}



button{

width:55px;

height:55px;

border:none;

border-radius:50%;

background:#87CEEB;

color:white;

font-size:25px;

cursor:pointer;

}


button:hover{

background:#1f4e79;

}


.movie-info button{

width:auto;

height:auto;

padding:12px 20px;

border-radius:6px;

font-size:16px;

}




#movieDetails{

display:none;

}


.movie-info{

background:#f4f9fc;

padding:25px;

border-radius:15px;

}


.movie-info h2{

color:#1f4e79;

}


.movie-info p{

margin:15px 0;

line-height:1.6;

}


iframe{

width:100%;

height:450px;

border-radius:10px;

border:none;

}



.footer{

background:#1f4e79;

color:white;

padding:40px 20px;

margin-top:50px;

text-align:center;

box-shadow:0 -5px 15px rgba(0,0,0,0.2);

}


.footer h2{

font-size:32px;

margin-bottom:15px;

color:#87CEEB;

}


.footer p{

font-size:16px;

margin:10px 0;

line-height:1.6;

}


.footer-links{

margin:25px 0;

}


.footer-links a{

color:white;

text-decoration:none;

font-weight:bold;

margin:0 15px;

}


.footer-links a:hover{

color:#87CEEB;

}


.copyright{

margin-top:25px;

font-size:14px;

opacity:.8;

}


@media (max-width: 950px){

.carousel-container{

height:400px;

}

.carousel{

width:100%;

height:340px;

}

.movie-card img{

width:180px;

height:260px;

}

.left{

transform:

translate(-140%,-50%)

scale(.8)

rotateY(25deg);

}

.right{

transform:

translate(40%,-50%)

scale(.8)

rotateY(-25deg);

}

iframe{

height:300px;

}

}


@media (max-width: 500px){

.carousel-container{

height:320px;

}

.carousel{

height:270px;

}

.movie-card img{

width:130px;

height:190px;

}

.movie-card h3{

font-size:14px;

}

.left{

transform:

translate(-110%,-50%)

scale(.75)

rotateY(25deg);

}

.right{

transform:

translate(10%,-50%)

scale(.75)

rotateY(-25deg);

}

h1{

font-size:28px;

}

}

</style>

</head>

<script>


function logout(){

localStorage.removeItem("login");

window.location.href="index.html";

}






let account = JSON.parse(
localStorage.getItem("account")
);


if(account)
{

document.getElementById("welcome").innerHTML =
"Welcome to FilmShelf, " + account.username;

}





let movies = [

{

title:"Avatar",

desc:"Avatar is a science fiction adventure film set on Pandora, a lush alien world inhabited by the Na'vi. The story follows Jake Sully, a former Marine who joins a mission that allows humans to control genetically engineered Na'vi bodies called avatars. As he becomes immersed in the Na'vi culture, Jake finds himself torn between his duty to humans and his loyalty to Pandora.",

trailer:"https://www.youtube.com/embed/5PSNL1qE6VY"

},



{

title:"Inception",

desc:"A skilled thief who steals secrets from people's dreams is given a chance at redemption by performing the impossible: planting an idea into a target's subconscious. As the team enters deeper dream levels, reality and illusion become difficult to separate.",

trailer:"https://www.youtube.com/embed/YoHD9XEInc0"

},



{

title:"3 Idiots",

desc:"3 Idiots follows three engineering students dealing with academic pressure, friendship, and personal dreams. The movie highlights creativity, innovation, and learning beyond traditional education.",

trailer:"https://www.youtube.com/embed/K0eDlFX9GMc"

},



{

title:"THE NUN",

desc:"The Nun is a supernatural horror movie from The Conjuring universe. The story follows Sister Irene and Father Burke as they investigate mysterious events at a Romanian monastery.",

trailer:"https://www.youtube.com/embed/QF-oyCwaArU"

},



{

title:"ऊनको स्वीटर",

desc:"Unko Sweater is a romantic social drama from Nepal. The movie explores love, relationships, culture, and emotional connections between people.",

trailer:"https://www.youtube.com/embed/8vafCOeuH_A"

},



{

title:"Dangal",

desc:"Dangal is a biographical sports drama based on Mahavir Singh Phogat and his daughters' journey in wrestling. It focuses on determination, hard work, and equality.",

trailer:"https://www.youtube.com/embed/x_7YlGv9u1g"

},



{

title:"Avengers Endgame",

desc:"After the devastating events that erased half of all life in the universe, the Avengers unite for one final mission to restore balance.",

trailer:"https://www.youtube.com/embed/TcMBFSGVi1c"

}


];





let current = 0;

let cards;

let selectedMovie = null;

function addToWatchlist(){

if(!selectedMovie)
{
return;
}

let watchlist =
JSON.parse(localStorage.getItem("watchlist")) || [];

let movieName =
selectedMovie.title;

if(!watchlist.includes(movieName))
{

watchlist.push(movieName);

localStorage.setItem(

"watchlist",

JSON.stringify(watchlist)

);

alert(movieName + " added to watchlist");

}

else
{

alert("Movie already exists in watchlist");


}

}

$(document).ready(function(){

cards = $(".movie-card");

function update(){

cards.removeClass(

"center left right hidden"

);

cards.addClass("hidden");

cards.eq(current)

.removeClass("hidden")

.addClass("center");

cards.eq(

(current-1+cards.length)%cards.length

)

.removeClass("hidden")

.addClass("left");

cards.eq(

(current+1)%cards.length

)

.removeClass("hidden")

.addClass("right");

}

update();

let autoSlide = setInterval(function(){

current = (current + 1) % cards.length;

update();

},4000);

$("#next").click(function(){

current = (current + 1) % cards.length;

update();

});

$("#prev").click(function(){

current = (current - 1 + cards.length) % cards.length;

update();

});

cards.click(function(){

if($(this).hasClass("center"))

{

selectedMovie = movies[current];

clearInterval(autoSlide);

$("#title")

.text(movies[current].title);

$("#description")

.text(movies[current].desc);

$("#trailer")

.attr(

"src",

movies[current].trailer

);

$("#movieDetails").slideDown();

}

});

});

</script>
