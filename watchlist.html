<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilmShelf Watchlist</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(to right,#eef7ff,#d8edff);
}

nav{
background:skyblue;
padding:15px 30px;
box-shadow:0 3px 10px gray;
display:flex;
align-items:center;
flex-wrap:wrap;
}

.nav-left a{
text-decoration:none;
color:black;
font-weight:bold;
margin-right:25px;
}

.nav-left a:hover{
color:white;
}

.nav-right{
margin-left:auto;
}

.nav-right a{
text-decoration:none;
color:black;
font-weight:bold;
}

.nav-right a:hover{
color:white;
}

h1{
text-align:center;
color:#1f4e79;
margin:25px;
font-size:40px;
}

.section{
width:90%;
margin:30px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.movie-card{
display:flex;
justify-content:space-between;
align-items:center;
background:#f4f9fc;
padding:20px;
margin-bottom:15px;
border-radius:10px;
}

.movie-card h3{
color:#1f4e79;
}

button{
padding:10px 15px;
border:none;
border-radius:5px;
background:#87CEEB;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#1f4e79;
}

.empty{
text-align:center;
font-size:22px;
color:#666;
padding:30px;
}

.footer{
background:#1f4e79;
color:white;
padding:40px 20px;
margin-top:50px;
text-align:center;
box-shadow:0 -5px 15px rgba(0,0,0,0.2);
}

.footer h2{
font-size:32px;
margin-bottom:15px;
color:#87CEEB;
}

.footer p{
font-size:16px;
margin:10px 0;
}

.footer-links{
margin:25px 0;
}

.footer-links a{
color:white;
text-decoration:none;
font-weight:bold;
margin:0 15px;
}

.footer-links a:hover{
color:#87CEEB;
}

.copyright{
margin-top:25px;
font-size:14px;
opacity:.8;
}

</style>

</head>

<body>

<script>

if(localStorage.getItem("login")!="yes")
{
window.location.href="index.html";
}

</script>

<nav>

<div class="nav-left">

<a href="home.html">
Home
</a>

<a href="watchlist.html">
Watchlist
</a>

<a href="reviews.html">
Reviews 
</a>

</div>

<div class="nav-right">

<a href="#" onclick="logout()">
Logout
</a>

</div>

</nav>

<h1 id="welcome">
My Watchlist
</h1>

<div class="section">

<div id="watchlistContainer">

</div>

</div>

<footer class="footer">

<h2>
FilmShelf
</h2>

<p>
Keep track of your favourite movies and never miss a masterpiece.
</p>

<div class="footer-links">

<a href="home.html">
Home
</a>

<a href="watchlist.html">
Watchlist
</a>

</div>

<p class="copyright">
© 2026 FilmShelf | Made for Movie Lovers
</p>

</footer>

<script>

function logout(){

localStorage.removeItem("login");

window.location.href="index.html";

}

let account =
JSON.parse(
localStorage.getItem("account")
);

if(account)
{
document.getElementById("welcome").innerHTML =
account.username + "'s Watchlist";
}

function loadWatchlist(){

let watchlist =
JSON.parse(
localStorage.getItem("watchlist")
) || [];

let container =
document.getElementById("watchlistContainer");

container.innerHTML = "";

if(watchlist.length == 0)
{
container.innerHTML =
"<div class='empty'>No movies added to watchlist yet.</div>";

return;
}

for(let i=0;i<watchlist.length;i++)
{
container.innerHTML +=

`
<div class="movie-card">

<h3>${watchlist[i]}</h3>

<button onclick="removeMovie(${i})">
Remove
</button>

</div>
`;

}

}

function removeMovie(index){

let watchlist =
JSON.parse(
localStorage.getItem("watchlist")
) || [];

watchlist.splice(index,1);

localStorage.setItem(
"watchlist",
JSON.stringify(watchlist)
);
loadWatchlist();
}
function clearWatchlist(){
if(confirm("Clear entire watchlist?"))
{
localStorage.removeItem("watchlist");
loadWatchlist();
}
}
loadWatchlist();
</script>
<div style="text-align:center; margin-bottom:30px;">
<button onclick="clearWatchlist()">
Clear Watchlist
</button>
</div>
</body>
</html>
