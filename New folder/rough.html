<!DOCTYPE html>
<html>
<head>
<title>FilmShelf</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:white;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    display:flex;
}

nav{
    width:200px;
    background:#000;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding-top:20px;
}

nav button{
    background:red;
    color:white;
    border:none;
    padding:15px;
    margin:10px;
    cursor:pointer;
    border-radius:5px;
    font-size:16px;
}

nav button:hover{
    background:darkred;
}

.content{
    flex:1;
    padding:20px;
    background:#111;
    color:white;
}

.page{
    display:none;
    padding:30px;
}

.active{
    display:block;
}

h1{
    margin-bottom:20px;
}

.movie-container{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.movie{
    background:#222;
    padding:15px;
    width:220px;
    border-radius:10px;
    text-align:center;
}

.movie img{
    width:100%;
    height:300px;
    border-radius:10px;
}

.watch-btn{
    background:red;
    color:white;
    border:none;
    padding:10px;
    margin-top:10px;
    cursor:pointer;
    border-radius:5px;
}

.stat-box{
    background:#222;
    padding:20px;
    margin:10px 0;
    border-radius:10px;
}

.review{
    background:#222;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
}
</style>

</head>
<body>

<nav>
    <div class="aside">
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('watchlist')">Watchlist</button>
    <button onclick="showPage('statistics')">Statistics</button>
    <button onclick="showPage('reviews')">Reviews</button>
    </div>
</nav>
<div class ="login-box">
    <h2>User Login</h2>
    <form action="home.html">
        <label>Username</label>
        <input type="text" required>
        <label>Password</label>
        <input type="password" required>
        <button type="submit">Login</button>
    </form>
</div>

<!-- HOME PAGE -->
<div id="home" class="page active">
    <h1>FilmShelf</h1>

    <div class="movie-container">

        <div class="movie">
            <img src="c:\Users\lenovo\Pictures\Saved Pictures\avatar3.webp">
            <h3>Avatar</h3>
            <p>Action / Adventure</p>
            <button class="watch-btn">Watch Now</button>
        </div>

        <div class="movie">
            <img src="c:\Users\lenovo\Pictures\Saved Pictures\Inception_(2010)_theatrical_poster.jpg">
            <h3>Inception</h3>
            <p>Sci-Fi / Thriller</p>
            <button class="watch-btn">Watch Now</button>
        </div>

        <div class="movie">
            <img src="c:\Users\lenovo\Pictures\Saved Pictures\Joker_(2019_film)_poster.jpg">
            <h3>Joker</h3>
            <p>Drama / Crime</p>
            <button class="watch-btn">Watch Now</button>
        </div>

        <div class="movie">
            <img src="c:\Users\lenovo\Pictures\Saved Pictures\Interstellar_film_poster.jpg">
            <h3>Interstellar</h3>
            <p>Sci-Fi</p>
            <button class="watch-btn">Watch Now</button>
        </div>

    </div>
</div>

<script>
function showPage(pageId){

    let pages = document.querySelectorAll('.page');

    pages.forEach(function(page){
        page.classList.remove('active');
    });

    document.getElementById(pageId).classList.add('active');
}

function login() {
    let username = document.getElementById("username").value;

    if(username !== "") {
        document.getElementById("loginSection").style.display = "none";

        document.getElementById("welcome").innerHTML =
            "Welcome, " + username + "!";
    }
}
</script>

</body>
</html>
